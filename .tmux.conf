# NOTE:
# - setw alias dari set-window-option
# - set alias dari set-option (buat pengaturan level server/session)
# - bind alias dari bind-key
# - unbind alias dari unbind-key

# reload tmux config
# unbind r
# bind r source-file ~/.tmux.conf
bind r source-file ~/.tmux.conf \; display-message "✅ Config reloaded!"
# reload config manual: tmux source-file ~/.tmux.conf

set -g default-shell /usr/bin/zsh
set -g status-position bottom
set -g default-terminal "tmux-256color"
set -g pane-border-style "fg=#000000"
set -g pane-active-border-style "fg=#5eacd3"
set -g status-style 'bg=#000000 fg=#5eacd3'

# Mengaktifkan mode navigasi Vi/Vim untuk copy/scroll mode tmux secara global (-g). Ini memungkinkan kamu bernavigasi saat melihat riwayat riwayat terminal menggunakan tombol ala Vim (h, j, k, l, Ctrl+u, Ctrl+d)
setw -g mode-keys vi

# Mengatur tombol v di dalam copy mode agar berfungsi untuk mulai menyeleksi/memblok teks, meniru perilaku Visual Mode pada Vim.
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Mengatur tombol y di dalam copy mode untuk menyalin (yank) teks yang dipilih ke dalam buffer tmux dan langsung keluar dari copy mode, meniru tombol yank pada Vim.
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# delay escape vim (Komentar penjelas bahwa opsi di bawahnya digunakan untuk memangkas jeda (delay) tombol Esc saat menjalankan editor Vim di dalam tmux.)
# Mengubah waktu tunggu antarmuka server (-s) tmux terhadap input tombol Esc menjadi 10 milidetik (default tmux biasanya 500ms). Setting ini wajib bagi pengguna Vim agar perpindahan dari Insert Mode ke Normal Mode via tombol Esc terasa instan tanpa delay.
set -s escape-time 10

# Status Bar Interval CPU Spikes
# Setting status-interval 1 runs status line shell scripts every second. On battery power, this can drain CPU. Use 5 to 15 seconds for ideal balance.
set -g status-interval 10

# cross-platform os clipboard sync
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# install: ctrl b + I (capital i)
# uninstall: ctrl b + alt + u
set -g @plugin 'tmux-plugins/tpm'

# session persistence across reboots 
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# setelah update plugin - biar gampang copy yg dalem kurung we: (cp .tmux.conf ~)
run '~/.tmux/plugins/tpm/tpm' # Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
